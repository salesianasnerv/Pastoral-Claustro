<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pastoral Claustro | Salesianas Nervión</title>
<meta property="og:title" content="Pastoral Claustro | Escuelas Salesianas María Auxiliadora (Nervión - Sevilla)">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pastoral-claustro.vercel.app/">
<link rel="canonical" href="https://pastoral-claustro.vercel.app/">
<meta name="description" content="Recursos pastorales para el claustro de Salesianas Nervión: lema del curso, Buenos Días, Bocadillo solidario y más.">

<!-- PWA: instalable en Android, iOS e iPadOS -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#009abb">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pastoral">
<link rel="icon" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --azul: #009abb;
    --azul-oscuro: #007791;
    --verde: #b4be00;
    --verde-oscuro: #939b00;
    --naranja: #ee712a;
    --naranja-hover: #d35a15;
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --radius: 16px;
    --shadow: 0 10px 25px -5px rgba(0, 154, 187, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1720;
      --card: #17212C;
      --text: #E7ECF2;
      --text-muted: #93A2B3;
      --border: #263340;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1720;
    --card: #17212C;
    --text: #E7ECF2;
    --text-muted: #93A2B3;
    --border: #263340;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Fira Sans', system-ui, sans-serif;
    line-height: 1.55;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 2.2rem 1.25rem 3.5rem;
  }

  /* CABECERA */
  header.page-head {
    text-align: center;
    margin-bottom: 2rem;
  }

  .logo {
    height: 58px;
    width: auto;
    display: block;
    margin: 0 auto 1rem;
  }

  .eyebrow {
    display: inline-block;
    background: rgba(0, 154, 187, 0.12);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    margin-bottom: 0.9rem;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--azul);
    margin: 0 0 0.5rem;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 1.02rem;
    margin: 0;
  }

  .divider {
    height: 2px;
    background: var(--azul);
    opacity: 0.85;
    width: 100%;
    max-width: 420px;
    margin: 1.4rem auto 0;
    border-radius: 999px;
  }

  /* BOTONES DE RECURSOS */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    grid-auto-rows: 1fr; /* todos los botones con la misma altura */
    gap: 1rem;
  }

  .tile {
    --accent: var(--azul);
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 1.4rem 1.3rem 1.25rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 5px solid var(--accent);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    color: var(--text);
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .tile:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px -8px rgba(0, 154, 187, 0.22);
  }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .tile.azul { --accent: var(--azul); }
  .tile.verde { --accent: var(--verde); }
  .tile.naranja { --accent: var(--naranja); }

  .tile-icon { font-size: 2rem; line-height: 1; margin-bottom: 0.3rem; }

  .tile-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
    margin: 0;
  }
  .tile.verde .tile-title { color: var(--verde-oscuro); }

  .tile-desc {
    color: var(--text-muted);
    font-size: 0.93rem;
    margin: 0;
    flex: 1;
  }

  .tile-go {
    margin-top: 0.6rem;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--accent);
  }
  .tile.verde .tile-go { color: var(--verde-oscuro); }

  .tile.soon {
    border-top-color: var(--border);
    box-shadow: none;
    background: transparent;
    border-style: dashed;
    border-top-style: solid;
    cursor: default;
  }
  .tile.soon:hover { transform: none; box-shadow: none; }
  .tile.soon .tile-title { color: var(--text-muted); }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 2.5rem;
  }

  /* INSTALAR APP */
  .install {
    display: none;
    align-items: center;
    gap: 0.8rem;
    max-width: 560px;
    margin: 0 auto 1.6rem;
    padding: 0.85rem 1rem;
    background: var(--card);
    border: 1px solid rgba(0, 154, 187, 0.35);
    border-radius: 14px;
    box-shadow: var(--shadow);
    font-size: 0.92rem;
  }
  .install.show { display: flex; }
  .install img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .install p { margin: 0; flex: 1; color: var(--text-muted); }
  .install strong { color: var(--text); }
  .install button {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.88rem;
    border: 0;
    border-radius: 999px;
    padding: 0.55rem 1rem;
    cursor: pointer;
  }
  .install .btn-install { background: var(--azul); color: #fff; }
  .install .btn-install:hover { background: var(--azul-oscuro); }
  .install .btn-close {
    background: transparent;
    color: var(--text-muted);
    padding: 0.4rem 0.5rem;
    font-size: 1.1rem;
    line-height: 1;
  }

  /* Tablet: dos columnas */
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* Móvil: botones en fila, icono a la izquierda, fáciles de pulsar */
  @media (max-width: 520px) {
    .wrap {
      padding: calc(1.4rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    header.page-head { margin-bottom: 1.4rem; }
    .logo { height: 46px; }
    h1 { font-size: 1.55rem; }
    .subtitle { font-size: 0.95rem; }
    .divider { margin-top: 1.1rem; }

    .grid { grid-template-columns: 1fr; gap: 0.75rem; }
    .tile {
      display: grid;
      grid-template-columns: 2.6rem 1fr auto;
      grid-template-areas: "icon title go" "icon desc go";
      column-gap: 0.85rem;
      row-gap: 0.1rem;
      align-items: center;
      align-content: center;
      padding: 0.95rem 1rem;
      border-top: 1px solid var(--border);
      border-left: 5px solid var(--accent);
    }
    .tile.soon { border-left-color: var(--border); border-left-style: solid; }
    .tile:hover { transform: none; }
    .tile:active { transform: scale(0.98); }
    .tile-icon { grid-area: icon; font-size: 1.8rem; margin: 0; text-align: center; }
    .tile-title { grid-area: title; font-size: 1.05rem; }
    .tile-desc { grid-area: desc; font-size: 0.86rem; line-height: 1.4; }
    .tile-go { grid-area: go; margin: 0; font-size: 0; }
    .tile-go::after { content: '›'; font-size: 1.7rem; line-height: 1; }

    .install { font-size: 0.86rem; }
    footer { margin-top: 2rem; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <img class="logo" src="logo.svg" alt="Salesianas Nervión">
    <span class="eyebrow">Claustro · Curso 2026-2027</span>
    <h1>Pastoral</h1>
    <p class="subtitle">Todos los recursos pastorales del colegio en un solo sitio.</p>
    <div class="divider"></div>
  </header>

  <div class="install" id="install" role="region" aria-label="Instalar la app">
    <img src="icon-192.png" alt="">
    <p id="install-text"><strong>Instala Pastoral</strong> en tu móvil para tenerla a mano.</p>
    <button class="btn-install" id="btn-install" type="button">Instalar</button>
    <button class="btn-close" id="btn-close" type="button" aria-label="Cerrar">✕</button>
  </div>

  <main class="grid" id="grid"></main>

  <footer>Escuelas Salesianas María Auxiliadora · Nervión (Sevilla)</footer>

</div>

<script>
  // Para añadir una utilidad nueva, basta con añadir un objeto a esta lista.
  // color: "azul" | "verde" | "naranja". Sin url → aparece como "Próximamente".
  const RECURSOS = [
    {
      icono: '✨',
      titulo: 'Lema del curso',
      desc: '«Aquí y ahora»: el lema, la canción y su sentido para este curso.',
      url: 'https://salesianas.org/aqui-y-ahora/',
      color: 'azul'
    },
    {
      icono: '☀️',
      titulo: 'Buenos Días',
      desc: 'Calendario y guías de los Buenos Días por etapas.',
      url: 'https://pastoral-bbdd.vercel.app/',
      color: 'verde'
    },
    {
      icono: '🥪',
      titulo: 'Bocadillo solidario',
      desc: 'Recuento del Bocadillo solidario para tutores y responsables de Pastoral.',
      url: 'https://pastoral-bocadillo.vercel.app/',
      color: 'naranja'
    },
    {
      icono: '➕',
      titulo: 'Próximamente',
      desc: 'Aquí irán apareciendo las nuevas utilidades de Pastoral.'
    }
  ];

  const grid = document.getElementById('grid');
  RECURSOS.forEach(r => {
    const el = document.createElement(r.url ? 'a' : 'div');
    el.className = 'tile ' + (r.url ? (r.color || 'azul') : 'soon');
    if (r.url) el.href = r.url;
    el.innerHTML = `
      <div class="tile-icon" aria-hidden="true">${r.icono}</div>
      <h2 class="tile-title">${r.titulo}</h2>
      <p class="tile-desc">${r.desc}</p>
      ${r.url ? '<span class="tile-go">Abrir →</span>' : ''}`;
    grid.appendChild(el);
  });

  // PWA: registro del service worker (permite instalar la web como app y abrirla sin conexión)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // Aviso para instalar la app (Android/Chrome: botón; iPhone/iPad: instrucciones)
  const instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const aviso = document.getElementById('install');
  const btnInstall = document.getElementById('btn-install');
  let cerrado = false;
  try { cerrado = localStorage.getItem('pastoral-install-cerrado') === '1'; } catch (e) {}
  let promptInstalar = null;

  if (!instalada && !cerrado) {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      promptInstalar = e;
      aviso.classList.add('show');
    });

    const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (esIOS) {
      document.getElementById('install-text').innerHTML =
        '<strong>Instala Pastoral:</strong> pulsa <b>Compartir</b> ⬆️ y luego <b>«Añadir a pantalla de inicio»</b>.';
      btnInstall.style.display = 'none';
      aviso.classList.add('show');
    }
  }

  btnInstall.addEventListener('click', async () => {
    if (!promptInstalar) return;
    promptInstalar.prompt();
    await promptInstalar.userChoice;
    promptInstalar = null;
    aviso.classList.remove('show');
  });

  document.getElementById('btn-close').addEventListener('click', () => {
    aviso.classList.remove('show');
    try { localStorage.setItem('pastoral-install-cerrado', '1'); } catch (e) {}
  });

  window.addEventListener('appinstalled', () => aviso.classList.remove('show'));
</script>

</body>
</html>
